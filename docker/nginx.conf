user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json application/vnd.apple.mpegurl application/x-mpegURL;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;
        client_max_body_size 32m;

        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Optional high-throughput delivery mode. The backend emits this
        # internal redirect only after validating the signed stream URL.
        location /internal/upstream {
            internal;
            resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
            resolver_timeout 5s;
            set $upstream_target $arg_target;
            proxy_pass $upstream_target;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Connection "";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header User-Agent $arg_ua;
            proxy_set_header Referer $arg_referer;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers * always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
            add_header Cache-Control "no-store" always;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 120s;
            fastcgi_buffering on;
        }

        location ~ /\. {
            deny all;
        }
    }
}
